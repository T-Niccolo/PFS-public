<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Flow Solutions | Data Exploration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .landing-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .logo {
            width: 150px;
            margin-bottom: 25px;
        }
        h1 {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-pfs {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
        }
        .btn-pfs:hover {
            background-color: #1a252f;
            color: white;
            transform: translateY(-2px);
        }
        .footer-link {
            margin-top: 30px;
            display: block;
            color: #bdc3c7;
            font-size: 0.9rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <!-- Assuming logo is in the same directory on GitHub Pages -->
        <img src="images/Logo.png" alt="Plant Flow Solutions Logo" class="logo">
        
        <h1>Data Exploration Tools</h1>
        <p>Interactive insights from our precision phenotyping trials. Building the future of crop resilience and efficiency.</p>
        
        <a href="post_biomass.html" class="btn-pfs">Go to Wheat Resilience Dashboard</a>
        
        <a href="https://www.plantflowsolutions.com" class="footer-link">www.plantflowsolutions.com</a>
    </div>

</body>
</html>
